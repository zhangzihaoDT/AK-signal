# v0.12.0 Layer③ Selection V2 — Eligibility / Vehicle / Timing Rewrite
#
# 架构结论：策略规则按主题配置，不共用全局 EntryPolicy / ExitPolicy。
# 每个策略有稳定 strategy_id（进入历史信号与回测产物的 Provenance）。
# 算法语义（状态转换如何识别、MA 如何计算等）留在代码；这里只放策略参数。
#
# Layer③ ETF 表达路径三段职责（冻结，v0.12.0）：
#   ③A Eligibility  哪些 ETF 可靠可用 → 进入车辆宇宙（主题归属 + 账户可交易 +
#                    流动性 + 数据可靠 lane2_reliable_360≠False + rps15/历史有效）。
#                    趋势态不是资格条件（vehicle 身份不随当天涨跌而变）。
#   ③B Vehicle Selection  同一表达方向内，在可靠候选中选「表达工具」。
#                    车辆分 = 纯适配度（amount_score + 固定池代表性），**不含 rps**。
#   ③C Timing  对已选定车辆独立判当前技术时机（trend → leadership → position → signal）
#                    → STRONG_BUY / BUY / WATCH / HOLD / WAIT。
#                    recommended = theme_confirmed ∧ signal∈{BUY,STRONG_BUY}。
#
# 纪律：position 从不单独产生买入信号。趋势不成立（trend=NOT_QUALIFIED）的标的
#       即使大幅低于 60 日线，仍然 WAIT；偏离 60 日线过高（HIGH）只输出 HOLD，不追高；
#       破位（BREAKDOWN，现价低于 MA60 超 breakdown_pct）中期趋势破坏，禁止买入。

etf_selection:
  # Layer③ ETF 候选策略（Policy，非指标定义）。
  #   - ③A Eligibility：trend.min_amount（流动性门）+ lane2 可靠性（见 lane_validation）
  #     + 主题归属/账户可交易。trend.allowed_trend_states 仅作 ③C 展示口径，不作资格门。
  #   - ③B Vehicle：vehicle.weights（amount_score 适配度）→ 方向去重选代表。
  #   - ③C Timing：leadership（主题内排序 → LEADER/CORE）→ historical_position → signal。
  #     signal 与 stock_selection.signal_policy 共用同一信号词汇表与规则（ETF 沿用个股思想）
  trend:
    allowed_trend_states: ["BUY_CANDIDATE", "STRONG_WATCH"]
    watch_allowed_trend_states: ["BUY_CANDIDATE", "STRONG_WATCH", "WATCH"]
    min_amount: 50000000

  # v0.12.0 ③B Vehicle Selection — 车辆适配度（选车，去 timing）
  #   weights: {"amount": 1.0, "fixed_pool": ...}（amount = amount_score，rps 不进选车）
  #   amount_score：固定区间 log 评分（floor→0，reference→cap，跨期/跨候选池可比，
  #     不依赖当天候选集合的相对大小）
  vehicle:
    weights:
      amount: 1.0
    amount_score:
      method: log_threshold
      floor: 50000000        # 成交额 ≤ floor → 0
      reference: 500000000   # 成交额 ≥ reference → cap（100）
      cap: 100

  leadership:
    core_rank_max: 1         # 主题内 rank≤1 → LEADER（核心主题 ETF）
    satellite_rank_max: 3    # rank≤3 → CORE（细分/卫星 ETF）；>3 → NON_CORE

  historical_position:
    enabled: true
    metric: ma60_deviation   # 乖离率：现价相对 60 日线的偏离百分比（(现价/MA60 − 1)×100）
    ma_window: 60            # 60 日线（MA60）
    breakdown_pct: -15.0     # 现价低于 MA60 超 15% → BREAKDOWN（趋势破坏，禁止买入）
    low_below_pct: -5.0      # 低于 MA60 5%~15% → LOW（深度回调，赔率区）
    high_above_pct: 10.0     # 高于 MA60 超 10% → HIGH（追高，不追）

  # v0.11 Phase 2 — Lane Validation（Decision 验证 Policy）。
  #   v0.12.0 Selection V2：L2 数据可靠性已前移至 ③A Eligibility——`_etf_eligible_pool`
  #   直接把 lane2_reliable_360=False 剔出车辆宇宙（lane-less 放行）。`reliability_hard_gate_enabled`
  #   保留为向后兼容字段，代码不再后置 veto（本字段已不参与决策，仅文档/审计）。
  #   Lane2 结构（repair-retest TARGET 等）= soft validation：仅标注/观察，不 gate；
  #   Lane3 阶段 = 纯 context（不 gate）。二者无 Policy 开关，由展示层消费。
  lane_validation:
    reliability_hard_gate_enabled: true

# stock_selection：Layer③ 个股准入 + 主题门控 + 四段信号（Policy，非指标定义）
#   ① trend：qualified_score + allowed_trend_states（趋势合格线）
#     - rps15_min：策略定义的 RPS15 底线（与 strategies.<id>.entry 对齐，供展示/对齐检查）
#   theme_confirm_states：哪些 strength_level 视为主题确认（Layer③ 前置 Gate；
#     与 Layer② 生成 strength_level 的 observe_threshold 无关——那是 Observation）
#   ② leadership：theme_rank = 主题内按 trend_score 排名 → LEADER（Top leader_rank_max）/
#     CORE（≤core_rank_max）/ NON_CORE；require_rps_outperform=true 时趋势分未过线
#     的一律不升 LEADER/CORE（保险丝，通常已被 ① 挡住）
#   ③ historical_position：现价相对 60 日线的乖离率（历史赔率，不产生趋势）
#   ④ signal_policy：规则顺序匹配（先命中先生效），未命中 → fallback_signal
stock_selection:
  trend:
    qualified_score: 70
    rps15_min: 80
    allowed_trend_states: ["S", "A"]

  theme_confirm_states: ["观察", "强势"]

  leadership:
    method: theme_rank
    leader_rank_max: 3       # 主题内综合排名 Top3 = LEADER
    core_rank_max: 10        # Top4~10 = CORE
    require_rps_outperform: true

  historical_position:
    enabled: true
    metric: ma60_deviation   # 乖离率：现价相对 60 日线的偏离百分比（(现价/MA60 − 1)×100）
    ma_window: 60            # 60 日线（MA60）
    breakdown_pct: -15.0     # 现价低于 MA60 超 15% → BREAKDOWN（趋势破坏，禁止买入）
    low_below_pct: -5.0      # 低于 MA60 5%~15% → LOW（深度回调，赔率区）
    high_above_pct: 10.0     # 高于 MA60 超 10% → HIGH（追高，不追）

  # ④ 最终信号（ETF 复用本规则；position 缺失/不可用时按中性 MID 处理，不升级也不压制）
  signal_policy:
    rules:
      - trend: QUALIFIED
        leadership: LEADER
        position: LOW
        signal: STRONG_BUY

      - trend: QUALIFIED
        leadership: LEADER
        position: MID
        signal: BUY

      - trend: QUALIFIED
        leadership: CORE
        position: LOW
        signal: BUY

      - trend: QUALIFIED
        leadership: CORE
        position: MID
        signal: WATCH

      - trend: QUALIFIED
        position: HIGH
        signal: HOLD

      - trend: QUALIFIED
        position: BREAKDOWN
        signal: WAIT

    fallback_signal: WAIT

strategies:
  ai_20:
    strategy_id: ai_fixed_20
    label: AI-20
    theme: ai_infrastructure
    universe_mode: configured

    entry:
      policy: trend_confirmation
      rps15_min: 80
      trend_score_min: 70
      allowed_trend_states: ["S", "A"]

    exit:
      policy: fixed_horizon
      horizon: 20

    weight: 0.6        # Core+Quality Mode B 的 AI 权重

  ai_ma:
    strategy_id: ai_ma20
    label: AI-MA
    theme: ai_infrastructure
    universe_mode: configured

    entry:
      policy: trend_confirmation
      rps15_min: 80
      trend_score_min: 70
      allowed_trend_states: ["S", "A"]

    exit:
      policy: ma_exit
      ma_window: 20

    weight: 0.6        # 对照实验（不进综合组合主策略）

  hc_20:
    strategy_id: hc_fixed_20
    label: HC-20
    theme: high_cashflow
    universe_mode: configured

    entry:
      policy: trend_confirmation
      rps15_min: 80
      trend_score_min: 70
      allowed_trend_states: ["S", "A"]

    exit:
      policy: fixed_horizon
      horizon: 20

    weight: 0.4        # Mode B 的 HC 权重
