# 维护侧词表与名称线索；RunDay 只读 etf_classification_facts.json，不运行本文件的推断规则。
# ETF 两个平行分类维度；名称规则均为未核验推断。
# 旧 asset_buckets 仅作计算兼容。规范见 docs/ETF_CLASSIFICATION.md。

version: etf-classification-v2
investment_markets: [境内, 港股, 美国, 其他海外, 跨市场, 待核实]
