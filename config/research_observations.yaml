# AKsignal Research — 独立观察组（v0.4.3 引入，2026-08 拆分独立文件）
#
# 职责边界：
#   本文件只维护「研究观察清单」——不进入 Layer ③ 主题确认、推荐或交易候选，
#   也不进入 stock-metrics / Selection「核心资产监控」。
#   消费方：config/research_baskets.yaml（Research Basket 回测）、
#           tools/fetch_observation_group_prices.py（观察组行情抓取）。
#   Selection 固定资产池在 config/selection_universe.yaml。
#   例外（2026-08-28）：auto_tier1_ai_infra 已纳入 selection_universe.yaml
#   （ai_infrastructure.auto_thermal_ai_cooling tier）参与监控与交易候选；
#   本文件仍是该组商业化阶段（evidence_stage 等）的研究事实源，stage log 以此为准。
#
# 当前观察组：
#   observation_groups.scania_china_watch
#     电驱 / 传动 / 热管理 / 智能底盘
#   observation_groups.auto_tier1_ai_infra    汽车热管理供应链 → AI 数据中心液冷 / Capex 外溢
#   observation_groups.auto_tier1_embodied    汽车供应链 → Physical AI 执行器 / 丝杠 / 轴承 / 控制器
#   未单独上市的法士特、汉德体系以 focus_entities 保留；listed_assets 只放可直接跟踪的上市代表。
#
# evidence_stage 固定枚举（只表达商业化推进阶段，不混入收入/产能维度）：
#   VALIDATION / DESIGN_WIN / ORDER / SMALL_BATCH / MASS_PRODUCTION
# 收入与产能为正交字段（可为空 = 无/未确认）：
#   revenue_evidence  NONE / CONFIRMED
#   capacity_stage    NONE / PLANNING / BUILDING / RAMPING
#
# 更新纪律（Schema v1）：每次修改本文件的阶段字段，必须同时在
#   config/research_stage_log.yaml 的 entries 追加一条记录（日期 / 标的 / 字段 /
#   from→to / 披露证据），不得覆盖或回填旧记录；
#   tests/research/test_baskets.py::test_stage_log_matches_current_config 守护一致性。
#
# sw_industry: 关联的申万二级行业代码（仅供研究展示参考，不注入 Layer ② 确认）。

observation_groups:
  scania_china_watch:
    label: "斯堪尼亚中国观察组"
    status: WATCH
    objective: "先观察商用车电驱、传动、热管理与智能底盘产业链"
    groups:
      electric_drive:
        label: "电驱"
        focus_entities: ["汇川技术", "英搏尔", "潍柴体系"]
        listed_assets:
          - {symbol: "300124", name: "汇川技术", market: CN, sw_industry: "801078.SI", note: "电驱与工控"}
          - {symbol: "300681", name: "英搏尔", market: CN, sw_industry: "801093.SI", note: "电驱动总成"}
          - {symbol: "000338", name: "潍柴动力", market: CN, sw_industry: "801096.SI", note: "潍柴体系 · 商用车动力"}
      transmission:
        label: "传动"
        focus_entities: ["双环传动", "法士特体系", "汉德体系"]
        listed_assets:
          - {symbol: "002472", name: "双环传动", market: CN, sw_industry: "801093.SI", note: "齿轮与传动"}
      thermal_management:
        label: "热管理"
        focus_entities: ["银轮", "中鼎"]
        listed_assets:
          - {symbol: "002126", name: "银轮股份", market: CN, sw_industry: "801093.SI", note: "汽车热管理"}
          - {symbol: "000887", name: "中鼎股份", market: CN, sw_industry: "801093.SI", note: "汽车零部件与热管理"}
      smart_chassis:
        label: "智能底盘"
        focus_entities: ["伯特利", "浙江世宝"]
        listed_assets:
          - {symbol: "603596", name: "伯特利", market: CN, sw_industry: "801093.SI", note: "制动系统与智能底盘"}
          - {symbol: "002703", name: "浙江世宝", market: CN, sw_industry: "801093.SI", note: "转向系统与智能底盘"}

  auto_tier1_ai_infra:
    label: "汽车热管理供应链 → AI 数据中心（液冷 / Capex）观察组"
    status: WATCH
    objective: "观察汽车热管理供应链向 AI 数据中心液冷与 Capex 的技术迁移与收入兑现：热管理技术平移 + 服务器液冷订单"
    groups:
      cooling_transfer:
        label: "热管理 → 数据中心液冷"
        listed_assets:
          - {symbol: "000887", name: "中鼎股份", market: CN, sw_industry: "801093.SI", evidence_stage: "ORDER", note: "AI液冷：液冷整机柜/CDU/微通道冷板/快插/管路 · 订单约3,800万"}
          - {symbol: "601689", name: "拓普集团", market: CN, sw_industry: "801093.SI", evidence_stage: "ORDER", note: "AI液冷（首批订单15亿为液冷服务器+储能+机器人等新行业合计，非全为AI液冷）"}
          - {symbol: "002126", name: "银轮股份", market: CN, sw_industry: "801093.SI", evidence_stage: "VALIDATION", note: "AI液冷：数据中心换热/液冷验证阶段"}
          - {symbol: "002536", name: "飞龙股份", market: CN, sw_industry: "801093.SI", evidence_stage: "MASS_PRODUCTION", revenue_evidence: "CONFIRMED", note: "服务器液冷：与HP/英维克/台达/施耐德/维谛/联想等合作 · 部分客户项目已量产"}
          - {symbol: "002050", name: "三花智控", market: CN, sw_industry: "801116.SI", evidence_stage: "MASS_PRODUCTION", revenue_evidence: "CONFIRMED", note: "数据中心液冷热管理零部件 · 阀/泵/换热器/控制器 · 已形成收入并与头部集成商合作"}

  auto_tier1_embodied:
    label: "汽车供应链 → Physical AI（执行器 / 丝杠 / 轴承 / 控制器）观察组"
    status: WATCH
    objective: "观察汽车供应链制造、执行与控制能力向具身智能核心部件的技术迁移与收入兑现"
    groups:
      execution_hardware:
        label: "执行硬件（丝杠 / 关节 / 执行器 / 轴承）"
        focus_entities: ["SKF（斯凯孚）"]
        listed_assets:
          - {symbol: "603009", name: "北特科技", market: CN, sw_industry: "801093.SI", evidence_stage: "SMALL_BATCH", capacity_stage: "BUILDING", note: "行星滚柱丝杠 · 人形机器人线性执行 · 产能建设中"}
          - {symbol: "601689", name: "拓普集团", market: CN, sw_industry: "801093.SI", evidence_stage: "SMALL_BATCH", revenue_evidence: "CONFIRMED", note: "机器人执行器 · 2025年收入1,359万元（保守按小批量，未定稳定量产）"}
          - {symbol: "002126", name: "银轮股份", market: CN, sw_industry: "801093.SI", evidence_stage: "SMALL_BATCH", revenue_evidence: "CONFIRMED", note: "旋转/线性关节 · 灵巧手 · 热管理模组 · 部分产品小批量并形成收入"}
      control_stack:
        label: "控制与电子（大脑 / 控制器 / 域控）"
        focus_entities: ["丸旭", "同驭汽车"]
        listed_assets:
          - {symbol: "600699", name: "均胜电子", market: CN, sw_industry: "801093.SI", evidence_stage: "MASS_PRODUCTION", revenue_evidence: "CONFIRMED", note: "Physical AI中央控制器 / 全域控制器 · 已向头部机器人客户规模化量产供货"}
