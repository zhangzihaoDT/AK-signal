# v0.6.1 主题级策略规格（Strategy Specification）
#
# 架构结论：策略规则按主题配置，不共用全局 EntryPolicy / ExitPolicy。
# 每个策略有稳定 strategy_id（进入历史信号与回测产物的 Provenance）。
# 算法语义（状态转换如何识别、MA 如何计算等）留在代码；这里只放策略参数。
#
# etf_selection：Layer③ ETF 候选的「准入—排序—输出」策略（Policy，非指标定义）。
#   - 准入：allowed_trend_states（趋势门）+ min_amount（流动性门）
#   - 排序：ranking.weights（rps15/rps20/amount_score 权重）
#   - amount_score：固定区间 log 评分（floor→0，reference→cap，跨期/跨候选池可比，
#     不依赖当天候选集合的相对大小）

etf_selection:
  allowed_trend_states: ["BUY_CANDIDATE", "STRONG_WATCH"]
  watch_allowed_trend_states: ["BUY_CANDIDATE", "STRONG_WATCH", "WATCH"]
  min_amount: 50000000
  ranking:
    weights:
      rps15: 0.55
      rps20: 0.25
      amount_score: 0.20
    amount_score:
      method: log_threshold
      floor: 50000000        # 成交额 ≤ floor → 0
      reference: 500000000   # 成交额 ≥ reference → cap（100）
      cap: 100

strategies:
  ai_20:
    strategy_id: ai_fixed_20
    label: AI-20
    theme: ai_infrastructure
    universe_mode: configured

    entry:
      policy: trend_confirmation
      rps15_min: 80
      trend_score_min: 70
      allowed_trend_states: ["S", "A"]

    exit:
      policy: fixed_horizon
      horizon: 20

    weight: 0.6        # Core+Quality Mode B 的 AI 权重

  ai_ma:
    strategy_id: ai_ma20
    label: AI-MA
    theme: ai_infrastructure
    universe_mode: configured

    entry:
      policy: trend_confirmation
      rps15_min: 80
      trend_score_min: 70
      allowed_trend_states: ["S", "A"]

    exit:
      policy: ma_exit
      ma_window: 20

    weight: 0.6        # 对照实验（不进综合组合主策略）

  hc_20:
    strategy_id: hc_fixed_20
    label: HC-20
    theme: high_cashflow
    universe_mode: configured

    entry:
      policy: trend_confirmation
      rps15_min: 80
      trend_score_min: 70
      allowed_trend_states: ["S", "A"]

    exit:
      policy: fixed_horizon
      horizon: 20

    weight: 0.4        # Mode B 的 HC 权重
