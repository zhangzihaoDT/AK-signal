# 指标参数（v0.6.1）— 参数进 config，算法留代码
#
# 职责：RPS/MA 窗口、趋势态生成阈值（Observation）。
# Policy 参数（ETF 候选准入/排序权重、个股合格线）在 strategies.yaml 的
# etf_selection 与各策略 entry 中，不放在本文件（本文件只定义指标口径）。

rps:
  short_window: 15
  medium_window: 20
  long_window: 60

moving_average:
  default_window: 20

signal_gates:
  etf:
    # ETF 趋势态生成阈值（Observation）：定义 BUY_CANDIDATE / STRONG_WATCH / WATCH
    strong_threshold: 80
    watch_threshold: 60
    # gate_states / watch_gate_states / min_amount 已迁移到 strategies.yaml etf_selection（Policy）
  stock:
    # 个股趋势合格线（Observation 的分数带边界；合格判定在策略 entry）
    qualified_score: 70
    allowed_trend_states: ["S", "A"]

confirmation:
  strong_threshold: 90
  observe_threshold: 80
  neutral_threshold: 60
  # 确认广度：confirmed 且 ≥ 该比例的焦点行业进入观察区 → BROAD，否则 NARROW（窄幅确认）
  broad_fraction: 0.5
  # WATCH：未确认但最强行业 RPS15 ≥ 该值（接近确认）
  watch_proximity: 70
