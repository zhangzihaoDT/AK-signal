# AKsignal Layer ③ — 两方向分层资产池（v0.4.3）
#
# 结构：theme（市场方向） → tier（标的层级） → assets
#
# theme 归属（bucket/行业/关键词）由 config/themes_two_directions.yaml 单一事实源推导，
# 本文件不重复维护 bucket，只维护每个主题的固定资产池。
#  theme 不在 themes_two_directions.yaml → bucket 为空，仅作展示，不参与确认门控。
#
# 当前范围（两方向）：
#   方向一  AI 基础设施（长期增长）
#   方向二  高现金流资产（电力 / 三大运营商 / 公用事业，稳定现金流资产）
#
# tier 层级语义：
#   theme_etf           主题 ETF（对应 theme 的首要表达）
#   sub_industry_etf    细分行业 ETF
#   leader              行业龙头
#   high_beta           高弹性标的
#   equipment_upstream  设备与上游
#
# sw_industry: 关联的申万二级行业代码（用于注入 Layer ② 行业确认信号）
#   属于该主题 industries → 注入 strength_level / 驱动分类
#   不在主题 industries → 报告显示「无行业确认」

themes:
  ai_infrastructure:
    label: "AI 基础设施"
    tiers:
      - key: theme_etf
        label: "主题 ETF"
