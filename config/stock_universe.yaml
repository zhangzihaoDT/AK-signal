# AKsignal Layer ③ — A股 AI/科技/半导体 ETF 与个股趋势 分层资产池
#
# 结构：theme（主题） → tier（标的层级，按优先级） → assets（标的）
#
# 层级语义（ARCHITECTURE.md ③）：
#   theme_etf           主题 ETF        AI 人工智能 / 半导体 / 通信
#   sub_industry_etf    细分行业 ETF    芯片 / 软件 / 计算机 / 云计算
#   leader              行业龙头
#   high_beta           高弹性标的
#   equipment_upstream  设备与上游
#
# sw_industry: 关联的申万二级行业代码（用于注入 Layer ② 行业确认信号）
#   - 属于 10 个重点行业 → 注入 strength_level / 驱动分类 / 子主题
#   - 不在重点行业 → 报告显示「无行业确认」

themes:
  ai_tech:
    label: "AI/科技/半导体"
    tiers:
      - key: theme_etf
        label: "主题 ETF"
