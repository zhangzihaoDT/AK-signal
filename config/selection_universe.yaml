# AKsignal Layer ③ — Selection 资产池（v0.4.3 / v0.9.1 重构）
#
# 结构：theme（市场方向） → tier（标的层级） → assets
#
# 职责边界：
#   本文件只维护「进入 Selection / Tier 确认 / 核心资产监控」的固定资产池。
#   研究观察组（scania_china_watch / auto_tier1_ai_infra / auto_tier1_embodied）
#   已拆分至 config/research_observations.yaml —— 它们不参与 Layer ③ 主题确认
#   与交易候选，仅供 Research Basket 与研究观察消费。
#
# theme 归属（bucket/行业/关键词）由 config/theme_registry.yaml 单一事实源推导，
# 本文件不重复维护 bucket，只维护每个主题的固定资产池。
#  theme 不在 theme_registry.yaml → bucket 为空，仅作展示，不参与确认门控。
#
# 当前主题池：
#   ai_infrastructure   AI 基础设施（长期增长，Tier basket 确认）
#   high_cashflow       高现金流资产（水电/核电 · 运营商 · 收费公路 · 港口 + 周期电力观察）
#   china_auto_global   中国汽车全球化（观察主题：整车/电池/电动化零部件/全球供应链）
#
# tier 层级语义：
#   theme_etf           主题 ETF（对应 theme 的首要表达）
#   sub_industry_etf    细分行业 ETF
#   optical_interconnect 光模块/光连接（中际旭创/新易盛/天孚通信…）
#   server_network      服务器与网络（工业富联）
#   semiconductor_components PCB/核心器件（沪电/胜宏/生益…）
#   high_speed_interconnect 高速互连/铜缆（立讯/沃尔核材/兆龙/鼎通）
#   server_power        服务器电源（麦格米特/欧陆通）
#   liquid_cooling      液冷/散热（英维克）
#   auto_thermal_ai_cooling 汽车热管理 → AI 液冷（中鼎/银轮/飞龙 + 跨主题注册的拓普/三花；
#                        2026-08 由观察组 auto_tier1_ai_infra 纳入，participation=monitor_only：
#                        只监控不交易，evidence_source 指向 research_observations.yaml 阶段事实源。
#                        升级路径：① 转正式 Tier（删 participation）→ ② 独立新 Theme → ③ 退回 Research Basket）
#   oem_global          整车全球化（比亚迪/上汽/长城）
#   battery_global      电池全球化（宁德/亿纬）
#   global_ev_components 电动化核心零部件（三花/拓普/科达利/伯特利）
#   global_auto_components 全球汽车供应链（福耀/科博达/均胜）
#   hydro_nuclear       水电/核电（长江电力/华能水电/国投电力/中国核电/中国广核）
#   telecom_operator    运营商（中国移动/中国电信/中国联通）
#   toll_road           收费公路（宁沪高速/粤高速A/招商公路）
#   port_operator       港口（上港集团/招商港口/青岛港）
#   cyclical_power_watch 周期电力观察（华能国际，火电周期，不占核心）
#
# tier 参与语义（participation，tier 级字段）：
#   tradeable（默认）  正常参与状态机 / 主题内排名 / 四段信号 / 交易候选
#   monitor_only      仅监控：进入 stock-metrics 与「核心资产监控」，不参与主题内排名与信号、
#                     不产生候选资格；可配 evidence_source 指向 research_observations.yaml
#                     观察组，报告展示商业化阶段（evidence_stage 等）
#
# sw_industry: 关联的申万二级行业代码（用于注入 Layer ② 行业确认信号）
#   属于该主题 industries → 注入 strength_level / 驱动分类
#   不在主题 industries → 报告显示「无行业确认」

