version: observation-sources-v1
stocks:
  provider: longbridge
  price_basis: Longbridge ForwardAdjust
  cross_provider_fallback: false
  benchmark: 000300.SH
  excluded:
    - market: HK
      symbol: '02525'
      reason: 暂不纳入本轮长桥生产接入；历史报价缺口待核查
etfs:
  providers: [em, sina]
  price_basis: existing_etf_series
  cross_module_fallback: false
indices:
  providers: [longbridge, csindex]
  price_basis: index_level
  universe_file: config/core_indices.yaml
  fallback: false
derivatives:
  provider: cffex
  price_basis: unadjusted_contract_prices
  universe_file: config/derivatives.yaml
  daily_url: http://www.cffex.com.cn/sj/hqsj/rtj/{month}/{day}/{date}_1.csv
  fallback: false
industry:
  provider: tdx
  classification: TDX Research Industry
  classification_snapshot: '20261016'
  price_status: integrated
  history_base: data/sources/tdx/raw/day
  update_mode: append_only
  universe_file: config/tdx_research_industry_20261016.csv
  expected_industries: 128
  source_url: https://www.tdx.com.cn/products/data/data/vipdoc/tdxzs_day.zip
  fallback: false
  historical_research_only: SW2021
