# 指标参数（v0.7.0）— 参数进 config，算法留代码
#
# 职责：RPS/MA 窗口、趋势态生成阈值（Observation）。
# Policy 参数（ETF 候选准入/排序权重、个股准入与主题门控）在 strategy_spec.yaml 的
# etf_selection / stock_selection 与各策略 entry 中，不放在本文件（本文件只定义指标口径）。
#
# v0.7.0 Market Pulse：Layer① 四维观察 = 趋势（RPS15）+ 今日（RPS1）+ 动量（ΔRPS15）+ 流动性。
#   today_window     RPS1（Today）观察窗口：最新 1 日收益的横截面百分位，仅展示不参与排序/选择
#   velocity_window  ΔRPS15（Velocity）回溯窗口：RPS15 今日 − RPS15 N个交易日前，仅展示不参与排序/选择
#   data_quality     数据质量（Observation 兜底）：
#     - max_single_day_return：回溯窗口内任一日 |收益| ≥ 该百分比 → 判定为异常
#       （份额折算/除权/异常行情）。异常资产不参与 RPS 横截面排名，原值保留并标记 data_quality_flag
#     - flag_window：异常检测回溯交易日数（对齐最长 RPS 窗口 60）

rps:
  short_window: 15
  medium_window: 20
  long_window: 60
  today_window: 1
  velocity_window: 5

data_quality:
  max_single_day_return: 20.0
  flag_window: 60

moving_average:
  default_window: 20

signal_gates:
  etf:
    # ETF 趋势态生成阈值（Observation）：定义 BUY_CANDIDATE / STRONG_WATCH / WATCH
    strong_threshold: 80
    watch_threshold: 60
    # gate_states / watch_gate_states / min_amount 已迁移到 strategy_spec.yaml etf_selection（Policy）
  # 个股合格线（stock_selection）已迁移到 strategy_spec.yaml（Policy）

confirmation:
  strong_threshold: 90
  observe_threshold: 80
  neutral_threshold: 60
  # 确认广度：confirmed 且 ≥ 该比例的焦点行业进入观察区 → BROAD，否则 NARROW（窄幅确认）
  broad_fraction: 0.5
  # 申万 Evidence 观察门（v0.9.2 起不再作为 Theme 状态「WATCH」的门槛）：
  # 未确认主题若最强行业 RPS15 ≥ 该值，展示层以「未确认 · 接近观察门」描述，不进 Theme state。
  watch_proximity: 70

# Tier-level confirmation（v0.9.1/v0.9.2，Observation）：三个主题（AI/汽车/高现金流）确认的
# 统一 Tier basket Gate。Tier Strength = 加权复合分（0-100），非横截面 RPS：
#     0.5 × median(trend_score) + 0.3 × 上涨比例×100 + 0.2 × 强趋势占比×100
#   门控：
#     tier_gate_strong   Tier Strength ≥ 该值 且 ≥1 只强趋势 → STRONG（强势）
#     tier_gate_observe  Tier Strength ≥ 该值 → CONFIRMED（已确认；主题确认 = ≥1 个 Tier 已确认）
#     tier_strength ∈ [0.5×observe, observe) → WATCH（观察；为什么观察由 reason_code 表达：
#       near_threshold / breadth_insufficient / trend_emerging / single_name_only）
#   strong_trend_min    单只个股 trend_score ≥ 该值 且 watch_level ∈ {S,A} → 计为「强趋势股票」
tier_confirmation:
  tier_gate_strong: 70
  tier_gate_observe: 55
  broad_fraction: 0.5
  strong_trend_min: 70
