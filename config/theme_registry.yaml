# AKsignal 两方向主题框架配置（v0.4.3）— 单一事实源
#
# 结构：bucket（组合意图） → theme（市场方向） → industries（申万二级行业）+ etf_keywords
#
#   方向一  Core      AI 基础设施（长期增长）
#   方向二  Quality   高现金流资产（电力 / 三大运营商 / 公用事业，稳定现金流资产）
#
#   bucket       为什么持有（Core / Quality）
#   theme        持有什么方向（AI 基础设施 / 高现金流资产）
#   industries   该主题关联的申万二级行业（Layer ② 行业确认的焦点组）
#     relevance   core = 核心 / related = 相关
#   etf_keywords  Layer ③ 从 Layer① 全市场 rotation 按名称关键词挑选 ETF 候选
#
# 消费方：
#   Layer ①  etf_signal.rotation    每主题 ETF 焦点组（rotation 报告）
#   Layer ②  sw_industry_rps.confirm  每主题行业群共振
#   Layer ③  selection              每主题候选资产（ETF + 个股观察池）
#
# 匹配规则：ETF 名称按 bucket 顺序、theme 顺序逐个关键词匹配，首个命中生效。
# 注意区分「AI 基础设施」与「AI 应用」：AI 应用（软件开发/IT 服务）不纳入基础设施主题。
#
# 高现金流资产为「质量信号」占位（signal_model=quality_equity，maturity=PARTIAL）：
# 当前用 SW 行业确认近似，完整股息/现金流质量 adapter 属 v0.5。
#
# Future Themes（Not Enabled）：Resource Cycle（有色/钢铁/煤炭）、High-end Equipment（高端装备）、
# Aerospace / Shipping（航空航天/船舶）等不在当前两方向，仅是「未启用」而非被否定，
# 可在本文件重新打开。若启用商品类 theme（如 copper/aluminum），表达的是「权益/ETF 代理」
# （ETF + 申万有色行业 + 资源股），非商品期货趋势系统，须标 maturity: PARTIAL。

version: "0.4.3"

buckets:
  core:
    label: "核心"
    objective: "获取长期收益"
    order: 1
    themes:
      ai_infrastructure:
        label: "AI 基础设施"
        signal_model: equity_theme
        maturity: LIVE
        objective: "AI 算力/芯片/通信基础设施（不含 AI 应用）"
        industries:
          - {code: "801081.SI", name: "半导体", relevance: core}
          - {code: "801083.SI", name: "元件", relevance: core}
          - {code: "801102.SI", name: "通信设备", relevance: core}
          - {code: "801101.SI", name: "计算机设备", relevance: related}
          - {code: "801084.SI", name: "光学光电子", relevance: related}
          - {code: "801078.SI", name: "自动化设备", relevance: related}
          - {code: "801085.SI", name: "消费电子", relevance: related}
        # Tier-level confirmation（v0.9.1）：主题确认由申万行业 Gate 升级为 Tier basket Gate。
        #   每个 Tier 是主题内的一篮子个股（成分股归属复用 selection_universe.yaml ai_infrastructure tiers，
        #   不重复维护股票清单）；universe_tiers 列出该 Tier 对应的 universe tier key。
        #   Tier 自算：Tier Strength（加权复合分）/ 上涨比例 / Trend Score 中位数 /
        #   强趋势股票数量 / 龙头贡献度。申万行业保留为 Evidence，不再是确认 Gate。
        tiers:
          optical:
            label: "光模块 / 光连接"
            universe_tiers: ["optical_interconnect"]
          server_network:
            label: "服务器与网络"
            universe_tiers: ["server_network"]
          pcb_core:
            label: "PCB / 核心器件"
            universe_tiers: ["semiconductor_components"]
          high_speed_interconnect:
            label: "高速互连 / 铜缆"
            universe_tiers: ["high_speed_interconnect"]
          server_power:
            label: "服务器电源"
            universe_tiers: ["server_power"]
          thermal:
            label: "液冷 / 散热"
            universe_tiers: ["liquid_cooling"]
        etf_keywords:
          - "人工智能"
          - "ai"
          - "芯片"
          - "半导体"
          - "集成电路"
          - "科创芯片"
          - "电子"
          - "算力"
          - "通信"
          - "计算机"
          - "云计算"
          - "大数据"
          - "信息技术"
          - "存储"
          - "光模块"

      china_auto_global:
        label: "中国汽车全球化"
        signal_model: equity_theme
        maturity: LIVE
        objective: "中国汽车产业链全球化（整车/电池/电动化零部件/激光雷达/供应链）"
        industries:
          - {code: "801095.SI", name: "乘用车", relevance: core}
          - {code: "801096.SI", name: "商用车", relevance: core}
          - {code: "801093.SI", name: "汽车零部件", relevance: core}
          - {code: "801737.SI", name: "电池", relevance: related}
          - {code: "801084.SI", name: "光学光电子", relevance: related}
        # Tier-level confirmation（v0.9.1）：汽车主题同 AI，走 Theme → Tier basket → 个股趋势
        #   每个 Tier 是主题内的一篮子个股（成分股归属复用 selection_universe.yaml 对应 tiers，
        #   不重复维护股票清单）；申万行业保留为 Evidence，不再是确认 Gate。
        tiers:
          oem_global:
            label: "整车全球化"
            universe_tiers: ["oem_global"]
          battery_global:
            label: "电池全球化"
            universe_tiers: ["battery_global"]
          global_ev_components:
            label: "电动化核心零部件"
            universe_tiers: ["global_ev_components"]
          global_auto_components:
            label: "全球汽车供应链"
            universe_tiers: ["global_auto_components"]
          adas_lidar:
            label: "ADAS 车载激光雷达"
            universe_tiers: ["adas_lidar"]
        etf_keywords:
          - "汽车"
          - "新能源车"
          - "智能驾驶"
          - "自动驾驶"
          - "汽车零部件"
          - "电池"
          - "锂电"

  quality:
    label: "质量"
    objective: "高现金流防守"
    order: 2
    themes:
      high_cashflow:
        label: "高现金流资产"
        signal_model: quality_equity
        maturity: PARTIAL
        objective: "电力（火电/水电/核电）/ 三大运营商 / 公用事业（高速·公路·港口）"
        industries:
          - {code: "801161.SI", name: "电力", relevance: core}
          - {code: "801223.SI", name: "通信服务", relevance: core}
          - {code: "801179.SI", name: "铁路公路", relevance: core}
          - {code: "801992.SI", name: "航运港口", relevance: core}
          - {code: "801163.SI", name: "燃气Ⅱ", relevance: related}
        # Tier-level confirmation（v0.9.1）：高现金流同 AI，走 Theme → Tier basket → 个股趋势
        #   每个 Tier 是主题内的一篮子个股（成分股归属复用 selection_universe.yaml 对应 tiers，
        #   不重复维护股票清单）；申万行业保留为 Evidence，不再是确认 Gate。
        tiers:
          hydro_nuclear:
            label: "水电 / 核电"
            universe_tiers: ["hydro_nuclear"]
          telecom_operator:
            label: "运营商"
            universe_tiers: ["telecom_operator"]
          toll_road:
            label: "收费公路"
            universe_tiers: ["toll_road"]
          port_operator:
            label: "港口"
            universe_tiers: ["port_operator"]
          cyclical_power_watch:
            label: "周期电力观察"
            universe_tiers: ["cyclical_power_watch"]
        etf_keywords:
          - "电力"
          - "绿电"
          - "绿色电力"
          - "水电"
          - "核电"
          - "清洁能源"
          - "电信"
          - "运营商"
          - "联通"
          - "公用事业"
          - "高速"
          - "港口"
          - "交通运输"
          - "铁路"
