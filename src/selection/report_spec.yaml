# Layer③ 报告声明式 Spec（v2）—— 报告结构真源
#
# 角色边界（冻结于 P0，见 docs/SELECTION_REPORT.md）：
#   决策行为真源：src/selection/selection.py + recommendation.py
#   报告结构真源：本文件（report_spec.yaml）
#   人类可读说明：docs/SELECTION_REPORT.md
#   HTML：Report Engine 解释本 Spec + ReportViewModel 的生成结果
#
# 纪律：
#   - 本文件只描述「呈现什么」（结构 / 顺序 / 列 / 标签 / 条件 / 优先级），
#     不描述「怎么算」；分类 / 叙事 / 变化日志等派生字段一律在 ReportViewModel，不污染核心 JSON。
#   - 只解释异常：NORMAL 主题压缩，异常（degraded / changed / actionable）展开。
#   - 修改本文件 = 修改报告内容；改后需同步 docs/SELECTION_REPORT.md 与 AGENTS.md。
#
# v0.12.1 IA（Selection V2 阅读顺序）：报告按决策漏斗组织 ——
#   Theme Confirmation → ③A Eligibility → ③B 表达载体 → ③C Timing → Why now → Next trigger。
#   关键拆解：「表达载体」（③B 选谁）≠「今日执行」（③C 现在买不买），独立成段。
#   06 = Why now？（当前为什么是这个结果）；07 = What changes it？（什么变化会改变结果）。

report:
  spec_version: 2
  id: selection
  title: "③ 今日投资建议"
  subtitle: "主题成立 → 可靠可用 ETF → 表达载体 → 今日执行 → 原因 / 触发 · 决策层只消费已落盘事实，禁止联网/重算"

  # 多标签分类 → 单标签展示状态的优先级（Spec 控制，业务代码不硬编码）
  display_priority: [degraded, changed, actionable, watch, normal]

  sections:
    - id: executive
      priority: primary
      renderer: decision_summary
      title: "01 今日结论"
    - id: theme_confirmation
      priority: primary
      renderer: theme_confirmation
      title: "02 Theme Confirmation · 主题成立吗"
      subtitle: "任一 Tier / 焦点行业进入确认门即开放主题资产池"
    - id: eligibility
      priority: secondary
      renderer: eligibility
      title: "03 ③A Eligibility · 可靠可用 ETF"
      subtitle: "③A 资格 = 账户内可交易 ∧ 流动性 ∧ Lane2 数据可靠 ∧ 有效行情；趋势态不是资格"
    - id: vehicle
      priority: secondary
      renderer: vehicle
      title: "04 ③B 表达载体 · 选哪只 ETF"
      subtitle: "同方向可靠候选中按载体适配度（amount）选代表 —— 载体 ≠ 今日可买"
    - id: timing
      priority: secondary
      renderer: timing
      title: "05 ③C Timing · 今日执行"
      subtitle: "对选定载体独立判当前时机：Lane1 趋势 → 位置 → 信号 → BUY / WATCH / WAIT"
    - id: why_now
      priority: secondary
      renderer: why_now
      title: "06 Why Now · 为什么是当前结果"
      subtitle: "当前为什么是这个结果（不买 / 买 的直接原因）"
    - id: next_trigger
      priority: secondary
      renderer: next_trigger
      title: "07 Next Trigger · 什么会改变结果"
      subtitle: "只列真正能改变 Policy 结果的条件（量化差距）；结果已定格时置空"
    - id: audit
      priority: appendix
      collapsed: true
      renderer: audit
      title: "08 决策审计"
      subtitle: "debug / audit console —— 全 ETF · reason_codes · Lane 上下文，不用于第一遍阅读"

  # ── 02 主题成立矩阵列定义 ──────────────────────────────────────────
  theme_confirmation_columns:
    - {key: theme_label,    header: 主题}
    - {key: confirmed_tag,  header: 成立,    fmt: confirmed_tag}
    - {key: breadth,        header: 确认面}
    - {key: confirm_reason, header: 依据}
    - {key: action,         header: 今日怎么做}

  # ── 03 ③A Eligibility 矩阵列定义 ────────────────────────────────────
  eligibility_columns:
    - {key: theme_label,  header: 主题}
    - {key: eligible,     header: ③A 可靠可用}
    - {key: pool,         header: 关键词命中}
    - {key: gate_note,    header: 资格说明}
    - {key: lanes_note,   header: Lane2/Lane3 说明}

  # ── 04 载体 / 05 时机 卡列定义（每主题一张卡，逐载体一行）───────────
  vehicle_columns:
    - {key: name,           header: 表达载体}
    - {key: code,           header: 代码}
    - {key: role_label,     header: 角色}
    - {key: selection_score,header: 适配度}
    - {key: carrier_reason, header: 为什么是它}
  timing_columns:
    - {key: name,              header: 载体}
    - {key: __exec__,          header: 今日执行, fmt: timing_exec}
    - {key: trend_status,      header: Lane1 趋势,  fmt: etf_trend_status}
    - {key: position,          header: 位置,        fmt: etf_position}
    - {key: lane2,             header: Lane2,       fmt: lane2_reliable}
    - {key: lane3,             header: Lane3,       fmt: lane3_state}
    - {key: signal,            header: 信号}
    - {key: exec_reason,       header: 原因}

  # ── 06/07 说明标签 ────────────────────────────────────────────────
  why_labels:
    confirmed_title: "{theme_label} · 为什么现在是{action_cn}"
    buy_text: "载体 {name} 通过 ③C timing（趋势门 + {signal}），可执行买入"
    no_carrier_text: "主题已成立，但无 ③A 合格载体（不可靠/流动性不足/不在账户）→ 等待合格载体"
    timing_wait_text: "载体 {name} 已入选，但 ③C timing=WAIT（{reason}）→ 现在不买"
    unconfirmed_text: "主题未成立（{confirmation_reason}）→ 不买，仅观察"

  next_trigger_labels:
    trigger_none: "今日结果已定格（无推荐的载体 timing 已到 / 无推荐意愿变化条件）"
    trigger_confirmed_gate: "任一 Tier / 焦点行业进入确认门（当前 {n_observe}/{n_total}）后主题成立，才谈得上载体"
    trigger_eligible_gate: "出现 ≥1 只通过 ③A 资格（可靠 ∧ 流动性 ∧ 账户）的 ETF 作载体候选"
    trigger_trend_gate: "载体 {name} 进入趋势态（Lane1 STRONG_WATCH / BUY_CANDIDATE，RPS15 ≥ {rps15_gate}；当前 RPS15 {rps15}）后转 BUY 候选"
    trigger_position_gate: "载体 {name} 位置回到 {target_position}（当前 {position_level}）后进入可执行区"
    trigger_unreliable_gate: "载体 {name} Lane2 数据恢复可靠（当前不可靠）后才具备表达资格"

  # ── 08 决策审计：全量矩阵列定义 ────────────────────────────────────
  audit:
    stock_matrix:
      title: 个股状态矩阵
      summary:
        - {id: breakdown,            label: 破位}
        - {id: blocked,              label: 阻塞}
        - {id: qualified_unselected, label: 合格未选}
        - {id: recommended,          label: 推荐}
        - {id: normal,               label: 正常观察}
        - {id: monitor_only,         label: 仅监控}
      source: monitoring.{leaders,high_beta,equipment}
      sort: anomaly_first             # 异常优先：BREAKDOWN→BLOCKED→QUALIFIED→RECOMMENDED→NORMAL→MONITOR_ONLY
      columns:
        - {key: name,              header: 标的}
        - {key: __category__,      header: 分类,      fmt: audit_category}
        - {key: __scope__,         header: 主题 / 角色, fmt: theme_role}
        - {key: __conclusion__,    header: 当前结论,   fmt: monitor_conclusion}
        - {key: __audit_reason__,  header: 为什么,     fmt: audit_reason}
        - {key: __trend__,         header: 趋势,       fmt: trend_heat}
        - {key: __trajectory__,    header: 变化,       fmt: trajectory}
      detail_columns:
        - {key: name,               header: 标的}
        - {key: _theme_label,       header: 主题}
        - {key: tier_label,         header: 赛道}
        - {key: participation,      header: 参与,      fmt: participation}
        - {key: technical_diagnostics, header: 技术状态, fmt: technical}
        - {key: blocking_flags,     header: 阻塞,      fmt: blocking}
        - {key: data_quality_flags, header: 数据,      fmt: data_quality}
        - {key: evidence_stage,     header: 证据阶段,  fmt: evidence, when: has_evidence}
        - {key: score_change_1d,    header: 日变化,    fmt: change_1d}
        - {key: score_trend,        header: 趋势分,    fmt: num}
        - {key: signal,             header: 信号}
        - {key: position_level,     header: 位置,      fmt: position_level}
        - {key: position_pct,       header: 位置值,    fmt: position_pct, header_fmt: position_header}
        - {key: data_status,        header: 数据状态}
    etf_matrix:
      title: ETF 状态矩阵
      summary:
        - {id: breakdown,            label: 破位}
        - {id: blocked,              label: 阻塞}
        - {id: eligible,             label: ③A 合格}
        - {id: vehicle,              label: 载体}
        - {id: timing_ready,         label: 时机到}
        - {id: unreliably,           label: 数据不可靠}
        - {id: below_account,        label: 不在账户}
        - {id: low_liquidity,        label: 流动性不足}
        - {id: below_trend,          label: 未达趋势}
        - {id: dedup_lost,           label: 载体落选}
        - {id: dynamic_watch,        label: 动态观察}
      source: etf_monitoring
      sort: anomaly_first
      columns:
        - {key: name,              header: ETF}
        - {key: __category__,      header: 分类,      fmt: audit_category}
        - {key: __scope__,         header: 主题 / 角色, fmt: etf_theme_role}
        - {key: __audit_reason__,  header: 为什么,     fmt: etf_audit_reason}
        - {key: reason_codes,      header: reason_codes}
        - {key: rps15,             header: RPS15,     fmt: num}
        - {key: trend_status,      header: Lane1 趋势, fmt: etf_trend_status}
        - {key: __position__,      header: 位置,       fmt: etf_position}
      detail_columns:
        - {key: name,               header: ETF}
        - {key: _theme_label,       header: 主题}
        - {key: monitoring_source,  header: 来源}
        - {key: role,               header: 角色}
        - {key: theme_rank,         header: 主题排名,  fmt: num}
        - {key: leadership_level,   header: 主题地位,  fmt: leadership}
        - {key: rps15,              header: RPS15,     fmt: num}
        - {key: rps1,               header: RPS1,      fmt: num}
        - {key: delta_rps15,        header: ΔRPS15,    fmt: num}
        - {key: trend_status,       header: 趋势状态,  fmt: etf_trend_status}
        - {key: liquidity,          header: 成交额,    fmt: liquidity}
        - {key: position_level,     header: 位置,      fmt: position_level}
        - {key: position_pct,       header: 位置值,    fmt: position_pct, header_fmt: position_header}
        - {key: blocking_flags,     header: 阻塞,      fmt: blocking}
        - {key: data_quality_flags, header: 数据,      fmt: data_quality}
        - {key: lane2_reliable_360, header: 数据(L2),  fmt: lane2_reliable}
        - {key: lane3_transition_state, header: 阶段(L3), fmt: lane3_state}
        - {key: signal,             header: 信号}
        - {key: reject_reason,      header: 原因}
